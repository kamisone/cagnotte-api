apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  selector: 
    matchLabels:
      component: api
  template:
    metadata:
      labels:
        component: api
    spec:
      containers:
        - name: api-container
          image: mo29172/cagnotte_api:latest
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: 500m
            requests:
              cpu: 200m
          env:
            - name: TZ
              value: UTC
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: NODE_ENV 
            - name:  API_PORT
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: API_PORT 
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: APP_URL 
            - name: TYPEORM_HOST
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: TYPEORM_HOST
            - name: TYPEORM_PORT
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: TYPEORM_PORT
            - name: TYPEORM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: TYPEORM_USERNAME
            - name: TYPEORM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: TYPEORM_PASSWORD 
            - name: TYPEORM_DATABASE
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: TYPEORM_DATABASE
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: JWT_REFRESH_SECRET
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: ADMIN_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: REDIS_PASSWORD
            - name: GCS_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: GCS_BUCKET_NAME
            - name: GCS_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: GCS_PROJECT_ID
            - name: GCS_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: GCS_CLIENT_EMAIL
            - name: GCS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: api-envs
                  key: GCS_PRIVATE_KEY

